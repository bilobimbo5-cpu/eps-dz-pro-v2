<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل - EPS DZ PRO</title>
  <style>
    body {
      font-family: Tajawal, system-ui, sans-serif;
      background: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: #eefbf3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6b7280; line-height: 1.6; }
    button {
      margin-top: 20px;
      background: #158455;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>
      هذه الصفحة لم تُفتح من قبل لذا لا يمكن عرضها دون اتصال.
      الصفحات التي زرتها سابقًا (الأقسام، التلاميذ، تسجيل الحضور) تبقى متاحة.
    </p>
    <button onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
